name = "threvo"
main = "./custom-worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

# Scheduled work. Each tick hits its own authenticated route; see
# custom-worker.ts for the cron -> route mapping.
#   every minute     -> publish queue, token refresh, billing expiry
#   every 5 minutes  -> analytics sync
[triggers]
crons = ["* * * * *", "*/5 * * * *"]
